spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
      file-size-threshold: 3MB
  application:
    name: ai-job-platform-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_job_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  assistant:
    max-history-messages: ${ASSISTANT_MAX_HISTORY_MESSAGES:8}
  deepseek:
    enabled: ${DEEPSEEK_ENABLED:false}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${DEEPSEEK_REQUEST_TIMEOUT:PT15S}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:512}
  external-jobs:
    enabled: ${EXTERNAL_JOBS_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT2H}
  cache:
    job-ttl: ${JOB_CACHE_TTL:PT10M}

server:
  port: 8080
